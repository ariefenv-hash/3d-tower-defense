<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prism Echo — 3D肉鸽塔防</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#0a0a0f;font-family:'Segoe UI',system-ui,sans-serif;
  overflow:hidden;color:#fff
}
/* 几何背景 */
.geo{position:fixed;pointer-events:none;opacity:.08}
.geo.circle{width:40vmax;height:40vmax;border-radius:50%;border:2px solid #fff;top:-10vmax;left:-10vmax}
.geo.square{width:30vmax;height:30vmax;border:2px solid #4f8ef7;bottom:-8vmax;right:-8vmax;transform:rotate(15deg)}
.geo.tri{width:0;height:0;border-left:12vmax solid transparent;border-right:12vmax solid transparent;border-bottom:20vmax solid #f74fa0;top:50%;left:50%;transform:translate(-50%,-50%)}
.geo.dot{width:4vmax;height:4vmax;border-radius:50%;background:#fff;top:20%;right:15%}
.geo.line{width:100vmax;height:1px;background:linear-gradient(90deg,transparent,#4f8ef7,transparent);top:40%;left:0}
.geo.line2{width:80vmax;height:1px;background:linear-gradient(90deg,transparent,#f74fa0,transparent);bottom:30%;left:10%;transform:rotate(-8deg)}
/* 卡片 */
.card{
  position:relative;z-index:1;text-align:center;
  padding:3rem 2.5rem;max-width:420px;width:90%;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  border-radius:20px;backdrop-filter:blur(12px)
}
.card h1{
  font-size:2.2rem;font-weight:700;letter-spacing:-.02em;margin-bottom:.4rem;
  background:linear-gradient(135deg,#4f8ef7,#f74fa0);-webkit-background-clip:text;-webkit-text-fill-color:transparent
}
.card p{font-size:.9rem;color:rgba(255,255,255,.5);margin-bottom:2rem}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  padding:.85rem 1.8rem;border-radius:12px;font-size:1rem;font-weight:600;
  cursor:pointer;transition:transform .15s,box-shadow .15s;border:none;
  text-decoration:none;min-width:160px
}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.btn:active{transform:translateY(0)}
.btn-play{
  background:linear-gradient(135deg,#4f8ef7,#6c5ce7);color:#fff;
  box-shadow:0 4px 20px rgba(79,142,247,.35)
}
.btn-copy{
  background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.12);
  margin-top:.8rem
}
.btn-copy.copied{background:rgba(46,204,113,.2);border-color:rgba(46,204,113,.4);color:#2ecc71}
.actions{display:flex;flex-direction:column;align-items:center}
@media(max-width:480px){
  .card{padding:2.2rem 1.6rem}
  .card h1{font-size:1.8rem}
}
</style>
</head>
<body>
<!-- 几何装饰 -->
<div class="geo circle"></div>
<div class="geo square"></div>
<div class="geo tri"></div>
<div class="geo dot"></div>
<div class="geo line"></div>
<div class="geo line2"></div>

<div class="card">
  <h1>Prism Echo</h1>
  <p>3D 肉鸽塔防 · 支持桌面 &amp; 移动端</p>
  <div class="actions">
    <a class="btn btn-play" id="playBtn" href="index.html">▶ 开始游戏</a>
    <button class="btn btn-copy" id="copyBtn">📋 复制链接分享</button>
  </div>
</div>

<script>
const GAMESITE = window.location.href.split('/launch.html')[0];

// 开始游戏：直接跳转
const playBtn = document.getElementById('playBtn');
playBtn.addEventListener('click', function(e){
  e.preventDefault();
  window.location.href = GAMESITE + '/index.html';
});

// 复制链接
const copyBtn = document.getElementById('copyBtn');
copyBtn.addEventListener('click', async function(){
  const url = window.location.href;
  try{
    await navigator.clipboard.writeText(url);
  }catch{
    // fallback for older browsers
    const ta = document.createElement('textarea');
    ta.value = url;document.body.appendChild(ta);
    ta.select();document.execCommand('copy');document.body.removeChild(ta);
  }
  copyBtn.textContent = '✓ 已复制';
  copyBtn.classList.add('copied');
  setTimeout(()=>{copyBtn.textContent='📋 复制链接分享';copyBtn.classList.remove('copied')},2000);
});
</script>
</body>
</html>

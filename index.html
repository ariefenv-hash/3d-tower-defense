<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>棱镜回响 · 星墨手卷 | 3D Roguelike 塔防</title>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />

<!-- PWA：可安装至主屏、离线可玩（需 https / localhost 托管；file:// 双击直开时自动跳过注册，不影响游玩） -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0b0e17" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="棱镜回响" />

<!-- 衬线字体：思源宋体（题字·正文）· Cormorant Garamond（数笈） -->
<!-- 联网时由 Google Fonts 提供；离线时回退本地宋体，书卷气不减 -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
  <!-- 3D 渲染画布容器 -->
  <div id="scene-holder"></div>

  <!-- 手卷装帧：暗角 · 纸纹（纯装饰，不拦截交互） -->
  <div id="scroll-dress" aria-hidden="true"></div>

  <!-- 顶部 HUD -->
  <div id="hud-top" class="hidden">
    <div class="hud-block" id="wave-block">
      <div class="hud-label">波次</div>
      <div class="hud-value" id="wave-num">1 <span class="hud-sub">/ 15</span></div>
      <div id="wave-dots"></div>
    </div>
    <div class="hud-block" id="wave-ctl">
      <button id="btn-next-wave" class="btn-primary">开始第 1 波</button>
      <div id="wave-countdown" class="hidden">20s</div>
    </div>
    <div class="hud-spacer"></div>
    <div class="hud-block">
      <div class="hud-label">星核完整度</div>
      <div id="core-hp-bar"><div id="core-hp-fill"></div></div>
      <div class="hud-value" id="core-hp-num">20 / 20</div>
    </div>
    <div class="hud-block">
      <div class="hud-label">能量</div>
      <div class="hud-value energy" id="energy-num">120</div>
    </div>
  </div>

  <!-- 左侧遗物栏 -->
  <div id="relic-bar" class="hidden"></div>

  <!-- 底部建造栏 -->
  <div id="build-bar" class="hidden">
    <div class="bar-title">布 防</div>
    <div id="build-cards"></div>
  </div>

  <!-- 触屏视野缩放控件（双指捏合之外的保险） -->
  <div id="zoom-ctl">
    <button id="zoom-in" aria-label="拉近视野">＋</button>
    <button id="zoom-out" aria-label="拉远视野">－</button>
  </div>

  <!-- 塔详情浮层 -->
  <div id="tower-panel" class="hidden">
    <div id="tp-head">
      <span id="tp-name">棱镜塔 Lv1</span>
      <button id="tp-close">✕</button>
    </div>
    <div id="tp-stats"></div>
    <div id="tp-actions">
      <button id="tp-upgrade" class="btn-primary">升级 ◆60</button>
      <button id="tp-sell" class="btn-danger">回收 +36</button>
    </div>
  </div>

  <!-- 提示 -->
  <div id="toast-wrap"></div>
  <div id="tip-bottom">左键 布防 / 选中 · 拖拽 转卷 · 滚轮 收放 · 1/2/3 选塔 · Esc 收手 · Space 开波</div>

  <!-- 模态层：菜单 / 遗物三选一 / 结算 -->
  <div id="modal-layer" class="hidden"></div>
</div>

<!-- 多文件加载：全局命名空间 PE（无需服务器，file:// 双击即玩） -->
<script src="vendor/three.min.js"></script>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/sfx.js"></script>
<script src="js/scene.js"></script>
<script src="js/map.js"></script>
<script src="js/beam.js"></script>
<script src="js/enemy.js"></script>
<script src="js/tower.js"></script>
<script src="js/waves.js"></script>
<script src="js/relics.js"></script>
<script src="js/game.js"></script>
<script src="js/input.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
